name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c requirements-dev.lock

      - name: Lint backend
        run: make lint

      - name: Check scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          make script-check

      - name: Run backend tests
        run: make test

      - name: Run TUI smoke check
        run: make tui-smoke

      - name: Run disposable agent harness
        run: make eval-agent EVAL_AGENT_ARGS=--no-llm
