name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements*.lock
            pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          make install-dev

      - name: Install script lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run repository verification
        run: make verify

      - name: Run disposable agent harness
        run: make eval-agent EVAL_AGENT_ARGS=--no-llm
