name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: devsynapse-linux-x86_64
            paths: |
              frontend/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              frontend/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage*
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: devsynapse-windows-x86_64
            paths: |
              frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*
              frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      TAURI_TARGET_TRIPLE: ${{ matrix.target }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ vars.DEVSYNAPSE_UPDATER_PUBLIC_KEY || secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_UPDATER_ENDPOINT: ${{ vars.DEVSYNAPSE_UPDATER_ENDPOINT || vars.TAURI_UPDATER_ENDPOINT || format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate release signing configuration
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is required"; exit 1; }
          test -n "$TAURI_UPDATER_PUBKEY" || { echo "::error::TAURI_UPDATER_PUBKEY is required"; exit 1; }
          test -n "$TAURI_UPDATER_ENDPOINT" || { echo "::error::TAURI_UPDATER_ENDPOINT is required"; exit 1; }

      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements*.lock
            pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build backend sidecar
        run: python scripts/build_backend.py --clean

      - name: Prepare signed updater configuration
        run: python scripts/prepare-tauri-release-config.py

      - name: Build desktop package
        working-directory: frontend
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.paths }}

  apt-repository:
    name: Build APT repository
    runs-on: ubuntu-24.04
    needs: package
    env:
      APT_CODENAME: stable
      APT_COMPONENT: main
      APT_ARCHITECTURE: amd64
      APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
      APT_REQUIRE_GPG: ${{ vars.DEVSYNAPSE_APT_REQUIRE_GPG || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Linux package artifact
        uses: actions/download-artifact@v8
        with:
          name: devsynapse-linux-x86_64
          path: artifacts/linux

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg

      - name: Build APT repository archive
        run: |
          mkdir -p artifacts/linux/debs
          find artifacts/linux -name '*.deb' -exec cp {} artifacts/linux/debs/ \;
          bash scripts/build-apt-repository.sh artifacts/linux/debs artifacts/apt

      - name: Upload APT repository artifact
        uses: actions/upload-artifact@v7
        with:
          name: devsynapse-apt-repository
          if-no-files-found: error
          path: |
            artifacts/apt/devsynapse-apt-repository.tar.gz
            artifacts/apt/devsynapse-apt-signing-key.asc

  linux-install-smoke:
    name: Linux package install smoke
    runs-on: ubuntu-24.04
    needs: package
    steps:
      - name: Download Linux package artifact
        uses: actions/download-artifact@v8
        with:
          name: devsynapse-linux-x86_64
          path: artifacts/linux

      - name: Install Debian package
        run: |
          sudo apt-get update
          deb="$(find artifacts/linux -name '*.deb' -print -quit)"
          test -n "$deb" || { echo "::error::No Debian package found"; exit 1; }
          sudo apt-get install -y "./$deb"

      - name: Verify installed desktop package
        run: |
          test -x /usr/bin/devsynapse-ai
          test -x /usr/bin/devsynapse-backend
          test -f "/usr/share/applications/DevSynapse AI.desktop"
          dpkg -L dev-synapse-ai | grep -E '/usr/bin/devsynapse-(ai|backend)$'

  publish:
    name: Publish GitHub release assets
    runs-on: ubuntu-24.04
    needs:
      - package
      - apt-repository
      - linux-install-smoke
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Stage release assets and updater manifest
        run: |
          python scripts/prepare-release-assets.py release-assets release-publish \
            --repository "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --notes "DevSynapse AI ${{ github.ref_name }}"

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            release-publish/*

      - name: Publish APT repository to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tarball="$(find release-publish -name 'devsynapse-apt-repository_*.tar.gz' -print -quit)"
          test -n "$tarball" || { echo "::error::No APT repository archive found"; exit 1; }

          rm -rf apt-pages
          mkdir -p apt-pages/apt
          tar -xzf "$tarball" -C apt-pages/apt --strip-components=1 repository
          touch apt-pages/.nojekyll
          cat > apt-pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>DevSynapse AI APT Repository</title>
            </head>
            <body>
              <h1>DevSynapse AI APT Repository</h1>
              <p>APT repository root: <code>/apt</code></p>
            </body>
          </html>
          HTML

          git -C apt-pages init
          git -C apt-pages checkout -b gh-pages
          git -C apt-pages config user.name "github-actions[bot]"
          git -C apt-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C apt-pages add .
          git -C apt-pages commit -m "deploy apt repository for ${{ github.ref_name }}"
          git -C apt-pages push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
