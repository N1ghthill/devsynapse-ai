name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: devsynapse-linux-x86_64
            paths: |
              frontend/src-tauri/target/release/bundle/deb/*.deb
              frontend/src-tauri/target/release/bundle/appimage/*.AppImage*
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: devsynapse-windows-x86_64
            paths: |
              frontend/src-tauri/target/release/bundle/nsis/*
              frontend/src-tauri/target/release/bundle/msi/*
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: devsynapse-macos-x86_64
            paths: |
              frontend/src-tauri/target/release/bundle/dmg/*.dmg
              frontend/src-tauri/target/release/bundle/macos/*.app.tar.gz*
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: devsynapse-macos-aarch64
            paths: |
              frontend/src-tauri/target/release/bundle/dmg/*.dmg
              frontend/src-tauri/target/release/bundle/macos/*.app.tar.gz*
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      TAURI_TARGET_TRIPLE: ${{ matrix.target }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ vars.DEVSYNAPSE_UPDATER_PUBLIC_KEY || secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_UPDATER_ENDPOINT: ${{ vars.DEVSYNAPSE_UPDATER_ENDPOINT || vars.TAURI_UPDATER_ENDPOINT || format('https://github.com/{0}/releases/latest/download/latest.json', github.repository) }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate release signing configuration
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is required"; exit 1; }
          test -n "$TAURI_UPDATER_PUBKEY" || { echo "::error::TAURI_UPDATER_PUBKEY is required"; exit 1; }
          test -n "$TAURI_UPDATER_ENDPOINT" || { echo "::error::TAURI_UPDATER_ENDPOINT is required"; exit 1; }

      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements*.lock
            pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build backend sidecar
        run: python scripts/build_backend.py --clean

      - name: Prepare signed updater configuration
        run: python scripts/prepare-tauri-release-config.py

      - name: Build desktop package
        working-directory: frontend
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.paths }}

  apt-repository:
    name: Build APT repository
    runs-on: ubuntu-24.04
    needs: package
    env:
      APT_CODENAME: stable
      APT_COMPONENT: main
      APT_ARCHITECTURE: amd64
      APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Linux package artifact
        uses: actions/download-artifact@v4
        with:
          name: devsynapse-linux-x86_64
          path: artifacts/linux

      - name: Install APT repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg

      - name: Import APT signing key
        if: env.APT_GPG_PRIVATE_KEY != ''
        run: |
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build APT repository archive
        run: |
          mkdir -p artifacts/linux/debs
          find artifacts/linux -name '*.deb' -exec cp {} artifacts/linux/debs/ \;
          bash scripts/build-apt-repository.sh artifacts/linux/debs artifacts/apt

      - name: Upload APT repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: devsynapse-apt-repository
          if-no-files-found: error
          path: artifacts/apt/devsynapse-apt-repository.tar.gz

  publish:
    name: Publish GitHub release assets
    runs-on: ubuntu-24.04
    needs:
      - package
      - apt-repository
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Stage release assets and updater manifest
        run: |
          python scripts/prepare-release-assets.py release-assets release-publish \
            --repository "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --notes "DevSynapse AI ${{ github.ref_name }}"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release-publish/*
