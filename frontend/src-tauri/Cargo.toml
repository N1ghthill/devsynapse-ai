[package]
name = "devsynapse-ai"
version = "1.0.0"
description = "DevSynapse AI desktop shell"
authors = ["Irving Ruas <n1ghthill@proton.me>"]
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
