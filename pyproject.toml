[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devsynapse-ai"
version = "1.2.3"
description = "A conversational desktop copilot for GitHub and GitHub Actions"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.33.1",
    "keyring>=25.7.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "textual>=8.0.0",
]

[project.scripts]
devsynapse = "devsynapse.cli:main"

[tool.setuptools.package-data]
devsynapse = ["styles/**/*.tcss"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  "venv",
  "__pycache__",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
]
ignore = [
  "B008",
  "E402",
  "E501",
  "E722",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
